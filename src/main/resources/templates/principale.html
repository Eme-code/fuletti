<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
	<title>Fuletti</title>
    <link rel="stylesheet" th:href="@{webjars/bootstrap/4.2.1/css/bootstrap.min.css}"/>
    <link rel="stylesheet" th:href="@{/css/main.css}"/></head>
<body>
	<main role="main" class="container">
		<div class="starter-template">
			<h1>Fuletti pagina principale</h1>
		</div>
		<p align="right"><a href="/fuletti/aggiornaDb">Aggiorna database</a></p>
		<p>Vanno presi <span th:text="${quantiDaPrendere}"></span> albi. Prezzo totale: <span th:text="${prezzoTotale}"></span> euri</p>
		<table border="1">
			<tr th:each="albo : ${listaAlbi}">
				<td th:text="${albo.testata.nome}"></td>
				<td th:text="${albo.numero}"></td>
				<td th:text="${albo.titolo}"></td>
				<td><a th:href="${albo.url_copertina}" /><img th:src="${albo.url_copertina}" height="65" width="50" ></td>
				<td th:text="${albo.prezzo}"></td>
				<td th:text="${#dates.format(albo.uscita, 'dd MMM yyyy')}"></td>
				<td>
					<div th:switch="${albo.uscita.before(#dates.createNow())}">
					    <span th:case="true"><a th:href="@{'/invertiPreso?id='+${albo.id}}" /><span th:text="${albo.preso} ? 'Preso' : 'Da prendere'"></span></span>
					    <span th:case="false">Non ancora uscito</span>
					</div>
				</td>
			</tr>
		</table>
	</main>
	<script type="text/javascript" th:src="@{webjars/bootstrap/4.2.1/js/bootstrap.min.js}"></script>
</body>
</html>
